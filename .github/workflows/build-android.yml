name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android NDK & Environment
        run: |
          echo "Locating pre-installed Android SDK and NDK..."
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          
          # Find latest pre-installed NDK in GitHub runner
          NDK_PATH=$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -mindepth 1 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$NDK_PATH" ]; then
            echo "Installing NDK via sdkmanager..."
            yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
            /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125"
            NDK_PATH="/usr/local/lib/android/sdk/ndk/26.1.10909125"
          fi
          
          echo "Using NDK at: $NDK_PATH"
          echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm install

      - name: Build Next.js
        run: npm run build
        env:
          TMDB_API_KEY: 8265bd1679663a7ea12ac168da84d2e8

      - name: Initialize Tauri Android Project
        run: npx tauri android init --ci
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          NDK_HOME: ${{ env.NDK_HOME }}

      - name: Build Android APK
        run: npx tauri android build --apk --ci
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          NDK_HOME: ${{ env.NDK_HOME }}

      - name: Sign Android APK
        run: |
          echo "Generating signing key..."
          keytool -genkeypair -v -keystore release.keystore -alias animestop -keyalg RSA -keysize 2048 -validity 10000 -storepass animestoppass -keypass animestoppass -dname "CN=AnimeStop, OU=AnimeStop, O=AnimeStop, L=Tokyo, S=Tokyo, C=JP"

          APKSIGNER=$(find /usr/local/lib/android/sdk/build-tools -name apksigner | sort -V | tail -n 1)
          echo "Using apksigner: $APKSIGNER"

          mkdir -p signed_apk
          for apk in $(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk"); do
            echo "Signing $apk..."
            $APKSIGNER sign --ks release.keystore --ks-pass pass:animestoppass --ks-key-alias animestop --key-pass pass:animestoppass --out "signed_apk/AnimeStop.apk" "$apk"
          done

      - name: Upload Signed Android APK
        uses: actions/upload-artifact@v4
        with:
          name: AnimeStop-Android-App
          path: signed_apk/AnimeStop.apk

